name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 (packageManager 锁定) 要求 Node ≥ 22.13，且 GitHub 已弃用 Node 20
        node-version: [22, 24]
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Use official download sources（CI 不经过 npmmirror）
        shell: bash
        run: |
          grep -v -E '^(registry|sass_binary_site|electron_mirror|electron_builder_binaries_mirror)=' .npmrc > .npmrc.ci
          mv .npmrc.ci .npmrc
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 ripgrep

      - name: Validate changeset coverage
        if: github.event_name == 'pull_request' && matrix.node-version == 22
        run: node scripts/validate-changeset.mjs "origin/${{ github.base_ref }}"

      - name: Check (type-check + lint + test:unit)
        run: pnpm check
