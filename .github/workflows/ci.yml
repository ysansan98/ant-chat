name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled rg binaries
        run: pnpm rg:prepare

      - name: Rebuild better-sqlite3
        run: pnpm rebuild:node

      - name: TypeScript check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test:unit

  ui-test:
    runs-on: ubuntu-latest
    needs: quality
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: UI flow test
        run: pnpm test:ui

  agent-e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled rg binaries
        run: pnpm rg:prepare

      - name: Rebuild better-sqlite3
        run: pnpm rebuild:node

      - name: Agent runtime e2e
        run: pnpm test:e2e:agent-runtime

