name: Release Electron app

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled rg binaries
        run: pnpm rg:prepare

      - name: Verify bundled rg binaries
        shell: bash
        run: |
          test -f resources/rg/darwin-arm64/rg
          test -f resources/rg/win32-x64/rg.exe
          echo "bundled rg binaries are ready"

      # macOS 代码签名配置
      # - name: Setup macOS code signing
      #   if: matrix.os == 'macos-latest'
      #   run: |
      #     # 创建临时 keychain
      #     security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

      #     # 导入代码签名证书
      #     echo "${{ secrets.CSC_LINK }}" | base64 --decode > certificate.p12
      #     security import certificate.p12 -k build.keychain -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

      #     # 清理临时文件
      #     rm certificate.p12

      # Windows 代码签名配置
      # - name: Setup Windows code signing
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     # 解码并保存证书文件
      #     echo "${{ secrets.WIN_CSC_LINK }}" | base64 --decode > certificate.p12
      #   shell: bash

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm build:win
        env:
          # Windows 代码签名环境变量
          # WIN_CSC_LINK: certificate.p12
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # GitHub 发布配置
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm build:mac
        env:
          # macOS 代码签名环境变量
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 公证环境变量（可选）
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # NOTARIZE: ${{ secrets.NOTARIZE_ENABLED || 'false' }}
          # GitHub 发布配置
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 清理敏感文件
      - name: Cleanup sensitive files
        if: always()
        run: |
          if [ -f "certificate.p12" ]; then
            rm certificate.p12
          fi
        shell: bash

      # 验证构建产物
      - name: Verify build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "验证 Windows 构建产物..."
          ls -la release/*/

          # 检查必要的文件是否存在
          if [ ! -f release/*/latest.yml ]; then
            echo "错误: 缺少 latest.yml 文件"
            exit 1
          fi

          # 验证签名（如果有签名工具）
          echo "Windows 构建产物验证完成"
        shell: bash

      - name: Verify build artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "验证 macOS 构建产物..."
          ls -la release/*/

          # 检查必要的文件是否存在
          if [ ! -f release/*/latest-mac.yml ]; then
            echo "错误: 缺少 latest-mac.yml 文件"
            exit 1
          fi

          # 验证代码签名
          for dmg in release/*/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "验证 $dmg 的签名..."
              codesign -v "$dmg" || echo "警告: $dmg 签名验证失败"
            fi
          done

          echo "macOS 构建产物验证完成"

      # 上传构建产物到 GitHub Releases
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*/*.exe
            release/*/*.zip
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.snap
            release/*/*.deb
            release/*/*.rpm
            release/*/*.tar.gz
            release/*/*.yml
            release/*/*.blockmap
            !release/*/elevate.exe
            !release/*/*-debug.yml
            !release/*/*debug.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
