name: Release Desktop

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Desktop tag
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Prepare bundled rg binaries
        run: pnpm -F @ant-chat/desktop rg:prepare

      - name: Verify bundled rg binaries
        shell: bash
        run: |
          test -f apps/desktop/resources/rg/darwin-arm64/rg
          test -f apps/desktop/resources/rg/win32-x64/rg.exe

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Install Electron native dependencies
        run: pnpm -F @ant-chat/desktop install-electron

      - name: Build Windows package
        if: matrix.os == 'windows-latest'
        run: pnpm -F @ant-chat/desktop build:win

      - name: Build macOS package
        if: matrix.os == 'macos-latest'
        run: pnpm -F @ant-chat/desktop build:mac

      - name: Verify and checksum artifacts
        shell: bash
        run: |
          test -d apps/desktop/release
          find apps/desktop/release -type f -print
          find apps/desktop/release -type f -not -name 'latest*.yml' -print0 | xargs -0 sha256sum > "apps/desktop/release/SHA256SUMS-${{ matrix.os }}.txt"

      - name: Smoke test packaged launcher
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            launcher=$(find apps/desktop/release -path '*/Contents/Resources/ant-chat/ant-chat' -type f -print -quit)
            test -n "$launcher"
            test -x "$launcher"
          else
            launcher=$(find apps/desktop/release -path '*/resources/ant-chat/ant-chat.cmd' -type f -print -quit)
            test -n "$launcher"
            launcher=$(cygpath -w "$launcher")
          fi
          set +e
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            "$launcher" settings show --data-dir "$RUNNER_TEMP/ant-chat-no-runtime" >/tmp/ant-chat-launcher.log 2>&1
          else
            powershell -NoProfile -Command "& '$launcher' settings show --data-dir '$RUNNER_TEMP/ant-chat-no-runtime'; exit \$LASTEXITCODE" >/tmp/ant-chat-launcher.log 2>&1
          fi
          launcher_code=$?
          set -e
          echo "launcher exit code: $launcher_code"
          echo "--- launcher output ---"
          cat /tmp/ant-chat-launcher.log 2>/dev/null || true
          test "$launcher_code" -ne 0
          grep -Eqi 'running|connect|运行|连接' /tmp/ant-chat-launcher.log

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/release
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          find release-assets -type f -print
          test "$(find release-assets -type f -name '*.dmg' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.zip' | wc -l)" -ge 2
          test "$(find release-assets -type f -name 'SHA256SUMS-*.txt' | wc -l)" -eq 2
          test -n "$(find release-assets -type f -name 'latest*.yml' -print -quit)"

      - name: Write release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          changelog=$(awk -v version="$version" '
            $0 == "## " version { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' apps/desktop/CHANGELOG.md)
          test -n "$changelog"
          {
            echo "# Ant Chat Desktop $version"
            echo
            printf '%s\n' "$changelog"
            echo
            echo "## 下载"
            echo
            echo "请从本 GitHub Release 下载对应平台安装包。当前安装包未签名或公证：macOS 可能需要在隐私与安全性设置中手动允许，Windows SmartScreen 可能显示未知发布者。"
            echo
            echo "## 网络安全"
            echo
            echo "产品的 HTTP Web UI、RPC 和 SSE 当前没有鉴权；使用 --host 只允许可信局域网或受控网络，禁止直接暴露到公网。"
          } > release-notes.md

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag"
            exit 0
          fi
          args=("$tag" --title "Ant Chat Desktop ${tag#v}" --notes-file release-notes.md)
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          for attempt in 1 2 3; do
            if gh release create "${args[@]}"; then
              break
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 5))
          done

      - name: Upload verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0)
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 5))
          done
