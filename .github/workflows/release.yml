name: Release Electron app

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: node -e "const fs = require('node:fs'); const tag = process.env.GITHUB_REF_NAME; const version = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8')).version; const expected = 'v' + version; if (tag !== expected) { console.error('Release tag ' + tag + ' does not match desktop package version ' + version); process.exit(1); } console.log('Release tag ' + tag + ' matches desktop package version ' + version);"

      - name: Prepare bundled rg binaries
        run: pnpm -F @ant-chat/desktop rg:prepare

      - name: Verify bundled rg binaries
        shell: bash
        run: |
          test -f apps/desktop/resources/rg/darwin-arm64/rg
          test -f apps/desktop/resources/rg/win32-x64/rg.exe
          echo "bundled rg binaries are ready"

      - name: Rebuild better-sqlite3
        run: pnpm -F @ant-chat/desktop rebuild:node

      - name: Build workspace packages
        run: pnpm build:packages

      # macOS 代码签名配置
      # - name: Setup macOS code signing
      #   if: matrix.os == 'macos-latest'
      #   run: |
      #     # 创建临时 keychain
      #     security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

      #     # 导入代码签名证书
      #     echo "${{ secrets.CSC_LINK }}" | base64 --decode > certificate.p12
      #     security import certificate.p12 -k build.keychain -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

      #     # 清理临时文件
      #     rm certificate.p12

      # Windows 代码签名配置
      # - name: Setup Windows code signing
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     # 解码并保存证书文件
      #     echo "${{ secrets.WIN_CSC_LINK }}" | base64 --decode > certificate.p12
      #   shell: bash

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm -F @ant-chat/desktop build:win -- --publish never

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm -F @ant-chat/desktop build:mac -- --publish never

      # 清理敏感文件
      - name: Cleanup sensitive files
        if: always()
        run: |
          if [ -f "certificate.p12" ]; then
            rm certificate.p12
          fi
        shell: bash

      # 验证构建产物
      - name: Verify build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "验证 Windows 构建产物..."
          ls -la apps/desktop/release/*/

          # 检查必要的文件是否存在
          if [ ! -f apps/desktop/release/*/latest.yml ]; then
            echo "错误: 缺少 latest.yml 文件"
            exit 1
          fi

          # 验证签名（如果有签名工具）
          echo "Windows 构建产物验证完成"
        shell: bash

      - name: Verify build artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "验证 macOS 构建产物..."
          ls -la apps/desktop/release/*/

          # 检查必要的文件是否存在
          if [ ! -f apps/desktop/release/*/latest-mac.yml ]; then
            echo "错误: 缺少 latest-mac.yml 文件"
            exit 1
          fi

          # 验证代码签名
          for dmg in apps/desktop/release/*/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "验证 $dmg 的签名..."
              codesign -v "$dmg" || echo "警告: $dmg 签名验证失败"
            fi
          done

          echo "macOS 构建产物验证完成"

      # 上传构建产物到 GitHub Releases
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.snap
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.rpm
            apps/desktop/release/*/*.tar.gz
            apps/desktop/release/*/*.yml
            apps/desktop/release/*/*.blockmap
            !apps/desktop/release/*/elevate.exe
            !apps/desktop/release/*/*-debug.yml
            !apps/desktop/release/*/*debug.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
